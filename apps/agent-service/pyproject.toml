[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reso-agent"
version = "0.1.0"
description = "Reso Agent service"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "httpx>=0.28,<0.29",
  "pydantic>=2.12,<3",
  "uvicorn[standard]>=0.40,<0.42",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["reso_agent"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
