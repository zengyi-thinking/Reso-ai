name: reso-ai

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: reso
      POSTGRES_USER: reso
      POSTGRES_PASSWORD: reso
    ports:
      - "5432:5432"
    volumes:
      - reso-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U reso -d reso"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  agent-service:
    build:
      context: .
      dockerfile: infra/docker/agent-service.Dockerfile
    environment:
      APP_ENV: development
      LLM_PROVIDER: mock
      TRACE_ENABLED: "false"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["pnpm", "--filter", "@reso/api", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://reso:reso@postgres:5432/reso
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: development
      API_PORT: 3000
      DATABASE_URL: postgresql://reso:reso@postgres:5432/reso
      REDIS_URL: redis://redis:6379/0
      PRODUCT_REPOSITORY: postgres
      SESSION_PROVIDER: postgres
      AGENT_PROVIDER: mock
      AGENT_SERVICE_URL: http://agent-service:8000
      TRACE_ENABLED: "false"
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      agent-service:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://reso:reso@postgres:5432/reso
      REDIS_URL: redis://redis:6379/0
      AGENT_PROVIDER: mock
      AGENT_SERVICE_URL: http://agent-service:8000
      PRODUCT_REPOSITORY: postgres
      SESSION_PROVIDER: postgres
      WORKER_POLL_MS: 1000
      WORKER_BATCH_SIZE: 10
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      agent-service:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 15
    depends_on:
      api:
        condition: service_healthy

volumes:
  reso-postgres:
